<!-- Member card (rows 48, 55): the one card of the site. Home turns it with the perk list (member.html), Memberships
     tilts it and fills it from the form. Styles: css/site/member-card.css, behaviour: js/site/member-card.js. -->
<div class="clubcard" data-clubcard role="img" aria-label="Break Point member card">
  <div class="clubcard__tilt" data-clubcard-tilt>
    <div class="clubcard__flip" data-clubcard-flip>
      <div class="clubcard__face clubcard__front">
        <svg class="clubcard__court" viewBox="0 0 300 180" preserveAspectRatio="none" aria-hidden="true">

        <p class="clubcard__name"><b data-card-name>Your name</b><span data-card-meta>No. 0417 · since 2026</span></p>

          <div class="clubcard__field clubcard__field--rank" data-field="2"><dt>Draws</dt><dd>Early entry</dd></div>
        </dl>
      </div>
      <div class="clubcard__face clubcard__back">
