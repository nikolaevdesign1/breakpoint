    <!-- Book a court: one full-screen call to action before the footer on every page that sells a court (partials/cta.html, cta.css). -->
    <section class="cta" id="book" aria-labelledby="cta-title">
      <video class="cta__media" src="/media/clips/clay-aerial.mp4" poster="/media/clips/clay-aerial.jpg" muted loop playsinline preload="metadata" aria-hidden="true" data-cta-video></video>
      <div class="cta__shade" aria-hidden="true"></div>
      <p class="tag cta__tag cta__tag--l">Mon–Fri {{fact:hours.weekday}}</p>
      <p class="tag cta__tag cta__tag--r">Sat–Sun {{fact:hours.weekend}}</p>

        <h2 class="cta__title" id="cta-title" data-lines>Court is free.<br /><em>Take it.</em></h2>
        <a class="cta__plate" href="/booking.html">
          <span class="cta__plate-label">Book a court</span>
          <svg class="cta__plate-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 3v6h9M8 5l4 4-4 4"/></svg>
        </a>
      </div>
    </section>
